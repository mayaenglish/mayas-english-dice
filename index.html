<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Maya's English Dice</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#eef2ff,#f8fafc);
    color:#172033;
    min-height:100vh;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:30px 20px;
    text-align:center;
}

.title{
    font-size:clamp(32px,5vw,60px);
    font-weight:900;
    margin-bottom:5px;
}

.subtitle{
    font-size:20px;
    color:#64748b;
    margin-bottom:25px;
}

.controls{
    background:white;
    padding:18px;
    border-radius:20px;
    margin-bottom:20px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

select{
    padding:12px 18px;
    border-radius:12px;
    border:2px solid #dbe3ee;
    font-size:17px;
    font-weight:700;
    margin:5px;
}

.dice-container{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.dice{
    background:white;
    border:3px solid #dbe3ee;
    border-radius:25px;
    min-height:190px;
    padding:25px 15px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.label{
    font-size:14px;
    font-weight:800;
    letter-spacing:2px;
    color:#64748b;
    text-transform:uppercase;
    margin-bottom:15px;
}

.word{
    font-size:clamp(25px,4vw,45px);
    font-weight:900;
    line-height:1.15;
}

.rolling{
    animation:shake .12s infinite alternate;
}

@keyframes shake{
    from{transform:rotate(-4deg) scale(.98);}
    to{transform:rotate(4deg) scale(1.03);}
}

button{
    border:none;
    border-radius:15px;
    padding:14px 22px;
    margin:6px;
    font-size:17px;
    font-weight:800;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.roll-button{
    background:#4f46e5;
    color:white;
    font-size:21px;
    box-shadow:0 8px 20px rgba(79,70,229,.3);
}

.secondary{
    background:white;
    color:#172033;
    border:2px solid #dbe3ee;
}

.challenge{
    background:white;
    border-radius:22px;
    padding:22px;
    margin:22px 0;
    box-shadow:0 8px 20px rgba(0,0,0,.07);
}

.challenge-title{
    font-size:18px;
    font-weight:900;
    color:#64748b;
    margin-bottom:10px;
}

.challenge-text{
    font-size:clamp(20px,3vw,30px);
    font-weight:900;
}

.sentence{
    background:white;
    border:3px solid #dbe3ee;
    border-radius:22px;
    padding:22px;
    margin:20px 0;
    font-size:clamp(20px,3vw,32px);
    font-weight:800;
    min-height:85px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.bottom{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:20px;
    margin-top:20px;
}

.panel{
    background:white;
    border:2px solid #dbe3ee;
    border-radius:20px;
    padding:20px;
}

.timer,
.score{
    font-size:42px;
    font-weight:900;
    margin:10px;
}

.team{
    font-size:20px;
    font-weight:900;
}

.footer{
    margin-top:30px;
    color:#94a3b8;
    font-size:14px;
}

@media(max-width:800px){
    .dice-container,
    .bottom{
        grid-template-columns:1fr;
    }

    .dice{
        min-height:150px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="title">
        🎲 MAYA'S ENGLISH DICE
    </div>

    <div class="subtitle">
        Daily Speaking Challenge
    </div>

    <div class="controls">

        <strong>TENSE:</strong>

        <select id="tense">
            <option value="present">Simple Present</option>
            <option value="past">Simple Past</option>
            <option value="future">Simple Future</option>
        </select>

    </div>

    <div class="dice-container">

        <div class="dice" id="dice1">
            <div class="label">Subject</div>
            <div class="word" id="subject">?</div>
        </div>

        <div class="dice" id="dice2">
            <div class="label">Verb</div>
            <div class="word" id="verb">?</div>
        </div>

        <div class="dice" id="dice3">
            <div class="label">Daily Activity</div>
            <div class="word" id="activity">?</div>
        </div>

    </div>

    <div>

        <button class="roll-button" id="rollButton">
            🎲 ROLL THE DICE
        </button>

        <button class="secondary" id="timerButton">
            ⏱️ START 30s
        </button>

        <button class="secondary" id="resetButton">
            🔄 RESET
        </button>

    </div>

    <div class="sentence" id="sentence">
        Roll the dice and make a complete sentence!
    </div>

    <div class="challenge">

        <div class="challenge-title">
            🎤 SPEAKING CHALLENGE
        </div>

        <div class="challenge-text" id="challenge">
            Roll the dice to start!
        </div>

    </div>

    <div class="bottom">

        <div class="panel">

            <div class="label">
                Speaking Timer
            </div>

            <div class="timer" id="timer">
                30
            </div>

        </div>

        <div class="panel">

            <div class="team">
                🔵 TEAM A
            </div>

            <div class="score" id="scoreA">
                0
            </div>

            <button class="secondary" onclick="addScore('A')">
                +1 Point
            </button>

        </div>

        <div class="panel">

            <div class="team">
                🔴 TEAM B
            </div>

            <div class="score" id="scoreB">
                0
            </div>

            <button class="secondary" onclick="addScore('B')">
                +1 Point
            </button>

        </div>

    </div>

    <div class="footer">
        Maya's English Dice • Classroom Speaking Activity
    </div>

</div>

<script>

const subjects = [
    "I",
    "You",
    "We",
    "They",
    "He",
    "She"
];

const verbs = [
    "get up",
    "eat",
    "drink",
    "go to",
    "study",
    "read",
    "clean",
    "play",
    "watch",
    "do",
    "have",
    "wash"
];

const activities = [
    "early in the morning",
    "breakfast",
    "water",
    "school",
    "English",
    "a book",
    "the bedroom",
    "football",
    "TV",
    "homework",
    "dinner",
    "the dishes"
];

const pastForms = {
    "get up":"got up",
    "eat":"ate",
    "drink":"drank",
    "go to":"went to",
    "study":"studied",
    "read":"read",
    "clean":"cleaned",
    "play":"played",
    "watch":"watched",
    "do":"did",
    "have":"had",
    "wash":"washed"
};

function randomItem(array){
    return array[Math.floor(Math.random() * array.length)];
}

function presentVerb(subject,verb){

    if(subject !== "He" && subject !== "She"){
        return verb;
    }

    const specialForms = {
        "have":"has",
        "do":"does",
        "go to":"goes to",
        "wash":"washes",
        "watch":"watches",
        "study":"studies",
        "play":"plays",
        "read":"reads",
        "clean":"cleans",
        "eat":"eats",
        "drink":"drinks",
        "get up":"gets up"
    };

    return specialForms[verb] || verb + "s";
}

function createSentence(){

    const subject =
        document.getElementById("subject").textContent;

    const verb =
        document.getElementById("verb").textContent;

    const activity =
        document.getElementById("activity").textContent;

    const tense =
        document.getElementById("tense").value;

    let correctVerb;

    if(tense === "present"){
        correctVerb = presentVerb(subject,verb);
    }

    if(tense === "past"){
        correctVerb = pastForms[verb];
    }

    if(tense === "future"){
        correctVerb = "will " + verb;
    }

    document.getElementById("sentence").textContent =
        subject + " " + correctVerb + " " + activity + ".";

    createChallenge();
}

function createChallenge(){

    const challenges = [
        "① Make a complete sentence.",
        "② Change it into a question.",
        "③ Change it into a negative sentence.",
        "④ Speak for 30 seconds."
    ];

    document.getElementById("challenge").textContent =
        challenges[Math.floor(Math.random() * challenges.length)];
}

const rollButton =
    document.getElementById("rollButton");

const diceElements = [
    document.getElementById("dice1"),
    document.getElementById("dice2"),
    document.getElementById("dice3")
];

rollButton.addEventListener("click",rollDice);

function rollDice(){

    rollButton.disabled = true;

    diceElements.forEach(
        dice => dice.classList.add("rolling")
    );

    let count = 0;

    const animation = setInterval(function(){

        document.getElementById("subject").textContent =
            randomItem(subjects);

        document.getElementById("verb").textContent =
            randomItem(verbs);

        document.getElementById("activity").textContent =
            randomItem(activities);

        count++;

        if(count >= 12){

            clearInterval(animation);

            diceElements.forEach(
                dice => dice.classList.remove("rolling")
            );

            rollButton.disabled = false;

            createSentence();
        }

    },100);
}

let time = 30;
let timerInterval = null;

document.getElementById("timerButton")
.addEventListener("click",function(){

    clearInterval(timerInterval);

    time = 30;

    document.getElementById("timer").textContent = time;

    this.textContent = "⏱️ RUNNING...";

    timerInterval = setInterval(function(){

        time--;

        document.getElementById("timer").textContent = time;

        if(time <= 0){

            clearInterval(timerInterval);

            document.getElementById("timerButton").textContent =
                "⏱️ START 30s";

            document.getElementById("challenge").textContent =
                "⏰ Time is up!";

        }

    },1000);

});

let scoreA = 0;
let scoreB = 0;

function addScore(team){

    if(team === "A"){
        scoreA++;
        document.getElementById("scoreA").textContent = scoreA;
    }

    if(team === "B"){
        scoreB++;
        document.getElementById("scoreB").textContent = scoreB;
    }
}

document.getElementById("resetButton")
.addEventListener("click",function(){

    clearInterval(timerInterval);

    document.getElementById("subject").textContent = "?";
    document.getElementById("verb").textContent = "?";
    document.getElementById("activity").textContent = "?";

    document.getElementById("sentence").textContent =
        "Roll the dice and make a complete sentence!";

    document.getElementById("challenge").textContent =
        "Roll the dice to start!";

    time = 30;

    document.getElementById("timer").textContent = "30";

    document.getElementById("timerButton").textContent =
        "⏱️ START 30s";

    scoreA = 0;
    scoreB = 0;

    document.getElementById("scoreA").textContent = "0";
    document.getElementById("scoreB").textContent = "0";

});

</script>

</body>
</html>
