<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maya's English Dice</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#eef2ff,#f8fafc);
    color:#172033;
    min-height:100vh;
}

.container{
    max-width:1250px;
    margin:auto;
    padding:28px 20px 40px;
    text-align:center;
}

.title{
    font-size:clamp(32px,5vw,60px);
    font-weight:900;
    margin-bottom:4px;
}

.subtitle{
    font-size:clamp(16px,2vw,21px);
    color:#64748b;
    margin-bottom:22px;
}

.topbar{
    background:white;
    padding:16px;
    border-radius:20px;
    box-shadow:0 8px 22px rgba(0,0,0,.07);
    margin-bottom:20px;
}

select{
    padding:11px 18px;
    border:2px solid #dbe3ee;
    border-radius:12px;
    font-size:17px;
    font-weight:700;
    margin-left:8px;
}

.dice-container{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.dice{
    background:white;
    border:3px solid #dbe3ee;
    border-radius:25px;
    min-height:190px;
    padding:25px 15px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.label{
    font-size:14px;
    font-weight:900;
    letter-spacing:2px;
    color:#64748b;
    text-transform:uppercase;
    margin-bottom:14px;
}

.word{
    font-size:clamp(25px,4vw,46px);
    font-weight:900;
    line-height:1.15;
}

.rolling{
    animation:shake .12s infinite alternate;
}

@keyframes shake{
    from{transform:rotate(-4deg) scale(.98)}
    to{transform:rotate(4deg) scale(1.03)}
}

.buttons{
    margin:22px 0;
}

button{
    border:none;
    border-radius:15px;
    padding:13px 20px;
    margin:5px;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.roll{
    background:#4f46e5;
    color:white;
    font-size:20px;
    padding:16px 27px;
}

.secondary{
    background:white;
    border:2px solid #dbe3ee;
    color:#172033;
}

.answer-buttons{
    margin-top:10px;
}

.answer-buttons button{
    min-width:190px;
}

.sentence{
    background:white;
    border:3px solid #dbe3ee;
    border-radius:22px;
    padding:23px;
    min-height:90px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(21px,3vw,34px);
    font-weight:900;
    margin:20px 0;
}

.challenge{
    background:white;
    border-radius:22px;
    padding:20px;
    box-shadow:0 8px 20px rgba(0,0,0,.07);
    margin-bottom:20px;
}

.challenge-title{
    color:#64748b;
    font-weight:900;
    font-size:15px;
    letter-spacing:1px;
}

.challenge-text{
    font-size:clamp(21px,3vw,30px);
    font-weight:900;
    margin-top:8px;
}

.answer{
    display:none;
    margin-top:15px;
    padding:15px;
    border-radius:15px;
    background:#f1f5f9;
    font-size:clamp(18px,2.5vw,27px);
    font-weight:800;
}

.bottom{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:18px;
}

.panel{
    background:white;
    border:2px solid #dbe3ee;
    border-radius:20px;
    padding:18px;
}

.timer{
    font-size:45px;
    font-weight:900;
    margin:8px;
}

.team{
    font-size:19px;
    font-weight:900;
}

.score{
    font-size:42px;
    font-weight:900;
    margin:5px;
}

.finish{
    background:#172033;
    color:white;
}

.winner{
    display:none;
    background:white;
    border-radius:25px;
    padding:30px;
    margin-top:22px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
}

.winner h2{
    font-size:32px;
    margin:5px;
}

.footer{
    margin-top:25px;
    color:#94a3b8;
    font-size:14px;
}

@media(max-width:800px){
    .dice-container,
    .bottom{
        grid-template-columns:1fr;
    }

    .dice{
        min-height:150px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="title">🎲 MAYA'S ENGLISH DICE</div>

    <div class="subtitle">
        Daily Speaking Challenge
    </div>

    <div class="topbar">
        <strong>TENSE:</strong>

        <select id="tense">
            <option value="present">Simple Present</option>
            <option value="past">Simple Past</option>
            <option value="future">Simple Future</option>
        </select>
    </div>

    <div class="dice-container">

        <div class="dice" id="diceSubject">
            <div class="label">Subject</div>
            <div class="word" id="subject">?</div>
        </div>

        <div class="dice" id="diceVerb">
            <div class="label">Verb</div>
            <div class="word" id="verb">?</div>
        </div>

        <div class="dice" id="diceActivity">
            <div class="label">Daily Activity</div>
            <div class="word" id="activity">?</div>
        </div>

    </div>

    <div class="buttons">

        <button class="roll" id="rollButton">
            🎲 ROLL THE DICE
        </button>

        <button class="secondary" id="timerButton">
            ⏱️ START 30s
        </button>

        <button class="secondary" id="resetButton">
            🔄 RESET
        </button>

        <button class="finish" id="finishButton">
            🏁 FINISH GAME
        </button>

    </div>

    <div class="sentence" id="sentence">
        Roll the dice and make a complete sentence!
    </div>

    <div class="challenge">

        <div class="challenge-title">
            🎤 SPEAKING CHALLENGE
        </div>

        <div class="challenge-text" id="challenge">
            Roll the dice to start!
        </div>

        <div class="answer" id="answer"></div>

        <div class="answer-buttons">

            <button class="secondary" id="showAnswerButton">
                👀 SHOW MODEL ANSWER
            </button>

            <button class="secondary" id="nextChallengeButton">
                🎯 NEXT CHALLENGE
            </button>

        </div>

    </div>

    <div class="bottom">

        <div class="panel">

            <div class="label">Speaking Timer</div>

            <div class="timer" id="timer">30</div>

        </div>

        <div class="panel">

            <div class="team">🔵 TEAM A</div>

            <div class="score" id="scoreA">0</div>

            <button class="secondary" onclick="addScore('A',1)">
                +1 Point
            </button>

            <button class="secondary" onclick="addScore('A',-1)">
                −1
            </button>

        </div>

        <div class="panel">

            <div class="team">🔴 TEAM B</div>

            <div class="score" id="scoreB">0</div>

            <button class="secondary" onclick="addScore('B',1)">
                +1 Point
            </button>

            <button class="secondary" onclick="addScore('B',-1)">
                −1
            </button>

        </div>

    </div>

    <div class="winner" id="winner">
        <h2>🎉 GREAT JOB!</h2>
        <div id="finalScore"></div>
    </div>

    <div class="footer">
        Maya's English Dice • Classroom Speaking Activity
    </div>

</div>

<script>

const subjects = [
    "I",
    "You",
    "We",
    "They",
    "He",
    "She"
];

/*
   Each verb is permanently paired with natural activities.
   This prevents impossible combinations such as:
   "study breakfast" or "wash football".
*/
const actions = [
    {
        verb:"get up",
        present:"get up",
        past:"got up",
        activities:[
            "early in the morning"
        ]
    },
    {
        verb:"brush",
        present:"brush",
        past:"brushed",
        activities:[
            "my teeth"
        ]
    },
    {
        verb:"take",
        present:"take",
        past:"took",
        activities:[
            "a shower"
        ]
    },
    {
        verb:"have",
        present:"have",
        past:"had",
        activities:[
            "breakfast",
            "lunch",
            "dinner"
        ]
    },
    {
        verb:"eat",
        present:"eat",
        past:"ate",
        activities:[
            "breakfast",
            "lunch",
            "dinner",
            "fruit"
        ]
    },
    {
        verb:"drink",
        present:"drink",
        past:"drank",
        activities:[
            "water",
            "milk",
            "juice"
        ]
    },
    {
        verb:"go to",
        present:"go to",
        past:"went to",
        activities:[
            "school",
            "the library",
            "the market",
            "the park"
        ]
    },
    {
        verb:"study",
        present:"study",
        past:"studied",
        activities:[
            "English",
            "mathematics",
            "science",
            "history"
        ]
    },
    {
        verb:"read",
        present:"read",
        past:"read",
        activities:[
            "a book",
            "a novel",
            "a magazine"
        ]
    },
    {
        verb:"write",
        present:"write",
        past:"wrote",
        activities:[
            "an email",
            "a story",
            "a journal"
        ]
    },
    {
        verb:"do",
        present:"do",
        past:"did",
        activities:[
            "homework",
            "housework",
            "exercise"
        ]
    },
    {
        verb:"play",
        present:"play",
        past:"played",
        activities:[
            "football",
            "badminton",
            "basketball",
            "volleyball"
        ]
    },
    {
        verb:"watch",
        present:"watch",
        past:"watched",
        activities:[
            "TV",
            "a movie",
            "a video"
        ]
    },
    {
        verb:"listen to",
        present:"listen to",
        past:"listened to",
        activities:[
            "music",
            "a podcast",
            "the radio"
        ]
    },
    {
        verb:"clean",
        present:"clean",
        past:"cleaned",
        activities:[
            "my bedroom",
            "the house",
            "the classroom"
        ]
    },
    {
        verb:"wash",
        present:"wash",
        past:"washed",
        activities:[
            "the dishes",
            "my clothes",
            "the car"
        ]
    },
    {
        verb:"help",
        present:"help",
        past:"helped",
        activities:[
            "my parents",
            "my friends",
            "my teacher"
        ]
    },
    {
        verb:"cook",
        present:"cook",
        past:"cooked",
        activities:[
            "dinner",
            "breakfast",
            "lunch"
        ]
    }
];

let currentSubject = "";
let currentAction = null;
let currentActivity = "";
let currentSentence = "";
let currentQuestion = "";
let currentNegative = "";

let previousActionIndex = -1;
let previousSubjectIndex = -1;

let scoreA = 0;
let scoreB = 0;

let time = 30;
let timerInterval = null;

let challengeIndex = 0;

const challenges = [
    "① Make a complete sentence.",
    "② Change it into a question.",
    "③ Change it into a negative sentence.",
    "④ Speak about it for 30 seconds."
];

function randomIndex(length){
    return Math.floor(Math.random() * length);
}

function chooseDifferentIndex(length,previous){
    if(length <= 1) return 0;

    let index;

    do{
        index = randomIndex(length);
    }while(index === previous);

    return index;
}

function getPresentVerb(subject,verb){

    if(subject !== "He" && subject !== "She"){
        return verb;
    }

    const forms = {
        "get up":"gets up",
        "brush":"brushes",
        "take":"takes",
        "have":"has",
        "eat":"eats",
        "drink":"drinks",
        "go to":"goes to",
        "study":"studies",
        "read":"reads",
        "write":"writes",
        "do":"does",
        "play":"plays",
        "watch":"watches",
        "listen to":"listens to",
        "clean":"cleans",
        "wash":"washes",
        "help":"helps",
        "cook":"cooks"
    };

    return forms[verb] || verb + "s";
}

function buildSentence(){

    const tense =
        document.getElementById("tense").value;

    let verb;

    if(tense === "present"){
        verb = getPresentVerb(
            currentSubject,
            currentAction.present
        );
    }

    if(tense === "past"){
        verb = currentAction.past;
    }

    if(tense === "future"){
        verb = "will " + currentAction.present;
    }

    currentSentence =
        currentSubject + " " +
        verb + " " +
        currentActivity + ".";

    document.getElementById("sentence").textContent =
        currentSentence;

    buildAnswers();
}

function buildAnswers(){

    const tense =
        document.getElementById("tense").value;

    const baseVerb =
        currentAction.present;

    if(tense === "present"){

        if(currentSubject === "I" ||
           currentSubject === "You" ||
           currentSubject === "We" ||
           currentSubject === "They"){

            currentQuestion =
                "Do " +
                currentSubject.toLowerCase() +
                " " +
                baseVerb +
                " " +
                currentActivity +
                "?";

            currentNegative =
                currentSubject +
                " don't " +
                baseVerb +
                " " +
                currentActivity +
                ".";

        }else{

            currentQuestion =
                "Does " +
                currentSubject.toLowerCase() +
                " " +
                baseVerb +
                " " +
                currentActivity +
                "?";

            currentNegative =
                currentSubject +
                " doesn't " +
                baseVerb +
                " " +
                currentActivity +
                ".";
        }
    }

    if(tense === "past"){

        currentQuestion =
            "Did " +
            currentSubject.toLowerCase() +
            " " +
            baseVerb +
            " " +
            currentActivity +
            "?";

        currentNegative =
            currentSubject +
            " didn't " +
            baseVerb +
            " " +
            currentActivity +
            ".";
    }

    if(tense === "future"){

        currentQuestion =
            "Will " +
            currentSubject.toLowerCase() +
            " " +
            baseVerb +
            " " +
            currentActivity +
            "?";

        currentNegative =
            currentSubject +
            " won't " +
            baseVerb +
            " " +
            currentActivity +
            ".";
    }
}

function rollDice(){

    document.getElementById("rollButton").disabled = true;

    document.querySelectorAll(".dice").forEach(
        dice => dice.classList.add("rolling")
    );

    let count = 0;

    const animation = setInterval(function(){

        const subjectIndex =
            randomIndex(subjects.length);

        const actionIndex =
            randomIndex(actions.length);

        const action =
            actions[actionIndex];

        const activityIndex =
            randomIndex(action.activities.length);

        document.getElementById("subject").textContent =
            subjects[subjectIndex];

        document.getElementById("verb").textContent =
            action.present;

        document.getElementById("activity").textContent =
            action.activities[activityIndex];

        count++;

        if(count >= 12){

            clearInterval(animation);

            document.querySelectorAll(".dice").forEach(
                dice => dice.classList.remove("rolling")
            );

            previousSubjectIndex = subjectIndex;
            previousActionIndex = actionIndex;

            currentSubject = subjects[subjectIndex];
            currentAction = action;
            currentActivity = action.activities[activityIndex];

            buildSentence();

            challengeIndex =
                randomIndex(challenges.length);

            document.getElementById("challenge").textContent =
                challenges[challengeIndex];

            document.getElementById("answer").style.display =
                "none";

            document.getElementById("answer").textContent = "";

            document.getElementById("rollButton").disabled = false;
        }

    },90);
}

document.getElementById("rollButton")
.addEventListener("click",rollDice);

document.getElementById("tense")
.addEventListener("change",function(){

    if(currentAction){
        buildSentence();
    }

});

document.getElementById("nextChallengeButton")
.addEventListener("click",function(){

    if(!currentAction){
        document.getElementById("challenge").textContent =
            "Roll the dice first!";
        return;
    }

    challengeIndex =
        (challengeIndex + 1) % challenges.length;

    document.getElementById("challenge").textContent =
        challenges[challengeIndex];

    document.getElementById("answer").style.display =
        "none";
});

document.getElementById("showAnswerButton")
.addEventListener("click",function(){

    if(!currentAction){
        return;
    }

    let answer = "";

    if(challengeIndex === 0){
        answer = currentSentence;
    }

    if(challengeIndex === 1){
        answer = currentQuestion;
    }

    if(challengeIndex === 2){
        answer = currentNegative;
    }

    if(challengeIndex === 3){
        answer =
            "Talk about: " +
            currentSentence +
            " — Add more details!";
    }

    const answerElement =
        document.getElementById("answer");

    answerElement.textContent = answer;
    answerElement.style.display = "block";
});

document.getElementById("timerButton")
.addEventListener("click",function(){

    clearInterval(timerInterval);

    time = 30;

    document.getElementById("timer").textContent = time;

    this.textContent = "⏱️ RUNNING...";

    timerInterval = setInterval(function(){

        time--;

        document.getElementById("timer").textContent = time;

        if(time <= 0){

            clearInterval(timerInterval);

            document.getElementById("timerButton").textContent =
                "⏱️ START 30s";

            document.getElementById("challenge").textContent =
                "⏰ TIME'S UP!";
        }

    },1000);
});

function addScore(team,amount){

    if(team === "A"){
        scoreA += amount;

        if(scoreA < 0) scoreA = 0;

        document.getElementById("scoreA").textContent =
            scoreA;
    }

    if(team === "B"){
        scoreB += amount;

        if(scoreB < 0) scoreB = 0;

        document.getElementById("scoreB").textContent =
            scoreB;
    }
}

document.getElementById("finishButton")
.addEventListener("click",function(){

    const winner =
        document.getElementById("winner");

    document.getElementById("finalScore").innerHTML =
        "<strong>TEAM A:</strong> " +
        scoreA +
        " &nbsp;&nbsp; | &nbsp;&nbsp; " +
        "<strong>TEAM B:</strong> " +
        scoreB;

    winner.style.display = "block";

    winner.scrollIntoView({
        behavior:"smooth"
    });
});

document.getElementById("resetButton")
.addEventListener("click",function(){

    clearInterval(timerInterval);

    currentSubject = "";
    currentAction = null;
    currentActivity = "";

    scoreA = 0;
    scoreB = 0;

    time = 30;

    document.getElementById("subject").textContent = "?";
    document.getElementById("verb").textContent = "?";
    document.getElementById("activity").textContent = "?";

    document.getElementById("sentence").textContent =
        "Roll the dice and make a complete sentence!";

    document.getElementById("challenge").textContent =
        "Roll the dice to start!";

    document.getElementById("answer").style.display =
        "none";

    document.getElementById("answer").textContent = "";

    document.getElementById("timer").textContent = "30";

    document.getElementById("scoreA").textContent = "0";
    document.getElementById("scoreB").textContent = "0";

    document.getElementById("timerButton").textContent =
        "⏱️ START 30s";

    document.getElementById("winner").style.display =
        "none";
});

</script>

</body>
</html>
