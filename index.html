<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Maya's English Dice</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#eef2ff,#f8fafc);
    color:#172033;
    min-height:100vh;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:35px 20px;
    text-align:center;
}

.title{
    font-size:clamp(30px,5vw,58px);
    font-weight:900;
    margin-bottom:5px;
}

.subtitle{
    font-size:20px;
    color:#64748b;
    margin-bottom:35px;
}

.dice-container{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.dice{
    background:white;
    border:3px solid #dbe3ee;
    border-radius:25px;
    min-height:200px;
    padding:25px 15px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.label{
    font-size:14px;
    font-weight:800;
    letter-spacing:2px;
    color:#64748b;
    text-transform:uppercase;
    margin-bottom:15px;
}

.word{
    font-size:clamp(25px,4vw,45px);
    font-weight:900;
    line-height:1.15;
}

.rolling{
    animation:shake 0.12s infinite alternate;
}

@keyframes shake{

    from{
        transform:rotate(-4deg) scale(.98);
    }

    to{
        transform:rotate(4deg) scale(1.03);
    }

}

.buttons{
    margin:30px 0 20px;
}

button{
    border:none;
    border-radius:15px;
    padding:16px 25px;
    margin:6px;
    font-size:17px;
    font-weight:800;
    cursor:pointer;
}

.roll-button{
    background:#4f46e5;
    color:white;
    font-size:20px;
    box-shadow:0 8px 20px rgba(79,70,229,.3);
}

.secondary{
    background:white;
    color:#172033;
    border:2px solid #dbe3ee;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.sentence{
    background:white;
    border:3px solid #dbe3ee;
    border-radius:22px;
    padding:25px;
    margin:20px 0;
    font-size:clamp(20px,3vw,32px);
    font-weight:800;
    min-height:90px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.bottom{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-top:20px;
}

.panel{
    background:white;
    border:2px solid #dbe3ee;
    border-radius:20px;
    padding:20px;
}

.timer,
.score{
    font-size:40px;
    font-weight:900;
    margin:10px;
}

.challenge{
    margin-top:25px;
    color:#64748b;
    font-size:16px;
}

.footer{
    margin-top:30px;
    color:#94a3b8;
    font-size:14px;
}

@media(max-width:700px){

    .dice-container{
        grid-template-columns:1fr;
    }

    .bottom{
        grid-template-columns:1fr;
    }

    .dice{
        min-height:150px;
    }

}

</style>
</head>


<body>

<div class="container">

    <div class="title">
        🎲 MAYA'S ENGLISH DICE
    </div>

    <div class="subtitle">
        Daily Speaking Challenge
    </div>


    <div class="dice-container">

        <div class="dice" id="dice1">

            <div class="label">
                Subject
            </div>

            <div class="word" id="subject">
                ?
            </div>

        </div>


        <div class="dice" id="dice2">

            <div class="label">
                Verb
            </div>

            <div class="word" id="verb">
                ?
            </div>

        </div>


        <div class="dice" id="dice3">

            <div class="label">
                Daily Activity
            </div>

            <div class="word" id="activity">
                ?
            </div>

        </div>

    </div>


    <div class="buttons">

        <button
            class="roll-button"
            id="rollButton">

            🎲 ROLL THE DICE

        </button>


        <button
            class="secondary"
            id="timerButton">

            ⏱️ START 30s

        </button>


        <button
            class="secondary"
            id="resetButton">

            🔄 RESET

        </button>

    </div>


    <div
        class="sentence"
        id="sentence">

        Roll the dice and make a complete sentence!

    </div>


    <div class="bottom">


        <div class="panel">

            <div class="label">
                Speaking Timer
            </div>

            <div
                class="timer"
                id="timer">

                30

            </div>

        </div>


        <div class="panel">

            <div class="label">
                Class Score
            </div>

            <div
                class="score"
                id="score">

                0

            </div>


            <button
                class="secondary"
                id="plusButton">

                +1 Point

            </button>


            <button
                class="secondary"
                id="minusButton">

                −1 Point

            </button>

        </div>

    </div>


    <div class="challenge">

        🎤 Challenge:
        Say the sentence aloud.
        Then change it into a question
        or a negative sentence.

    </div>


    <div class="footer">

        Maya's English Dice • Classroom Speaking Activity

    </div>

</div>



<script>


const subjects = [

    "I",
    "You",
    "We",
    "They",
    "He",
    "She"

];


const verbs = [

    "get up",
    "eat",
    "drink",
    "go to",
    "study",
    "read",
    "clean",
    "play",
    "watch",
    "do",
    "have",
    "wash"

];


const activities = [

    "early in the morning",
    "breakfast",
    "water",
    "school",
    "English",
    "a book",
    "the bedroom",
    "football",
    "TV",
    "homework",
    "dinner",
    "the dishes"

];


function randomItem(array){

    return array[
        Math.floor(
            Math.random() * array.length
        )
    ];

}


function correctVerb(subject,verb){

    if(subject !== "He" && subject !== "She"){

        return verb;

    }


    const specialForms = {

        "have":"has",

        "do":"does",

        "go to":"goes to",

        "wash":"washes",

        "watch":"watches",

        "study":"studies",

        "play":"plays",

        "read":"reads",

        "clean":"cleans",

        "eat":"eats",

        "drink":"drinks",

        "get up":"gets up"

    };


    if(specialForms[verb]){

        return specialForms[verb];

    }


    return verb + "s";

}



const subjectElement =
    document.getElementById("subject");


const verbElement =
    document.getElementById("verb");


const activityElement =
    document.getElementById("activity");


const sentenceElement =
    document.getElementById("sentence");


const rollButton =
    document.getElementById("rollButton");


const timerButton =
    document.getElementById("timerButton");


const resetButton =
    document.getElementById("resetButton");


const timerElement =
    document.getElementById("timer");


const scoreElement =
    document.getElementById("score");


const diceElements = [

    document.getElementById("dice1"),

    document.getElementById("dice2"),

    document.getElementById("dice3")

];



let score = 0;

let time = 30;

let timerInterval = null;



rollButton.addEventListener(
    "click",
    rollDice
);



function rollDice(){

    rollButton.disabled = true;


    diceElements.forEach(
        dice => dice.classList.add("rolling")
    );


    let count = 0;


    const animation = setInterval(

        function(){

            subjectElement.textContent =
                randomItem(subjects);


            verbElement.textContent =
                randomItem(verbs);


            activityElement.textContent =
                randomItem(activities);


            count++;


            if(count >= 10){

                clearInterval(animation);


                diceElements.forEach(
                    dice => dice.classList.remove("rolling")
                );


                rollButton.disabled = false;


                createSentence();

            }

        },

        100

    );

}



function createSentence(){

    const subject =
        subjectElement.textContent;


    const verb =
        verbElement.textContent;


    const activity =
        activityElement.textContent;


    const correct =
        correctVerb(subject,verb);


    sentenceElement.textContent =

        subject +
        " " +
        correct +
        " " +
        activity +
        ".";

}



timerButton.addEventListener(

    "click",

    startTimer

);



function startTimer(){

    clearInterval(timerInterval);


    time = 30;

    timerElement.textContent = time;


    timerButton.textContent =
        "⏱️ RUNNING...";


    timerInterval = setInterval(

        function(){

            time--;

            timerElement.textContent =
                time;


            if(time <= 0){

                clearInterval(timerInterval);


                timerButton.textContent =
                    "⏱️ START 30s";


                sentenceElement.textContent =
                    "⏰ Time is up!";

            }

        },

        1000

    );

}



document.getElementById(
    "plusButton"
).addEventListener(

    "click",

    function(){

        score++;

        scoreElement.textContent =
            score;

    }

);



document.getElementById(
    "minusButton"
).addEventListener(

    "click",

    function(){

        score--;

        if(score < 0){

            score = 0;

        }

        scoreElement.textContent =
            score;

    }

);



resetButton.addEventListener(

    "click",

    function(){

        clearInterval(timerInterval);


        subjectElement.textContent =
            "?";


        verbElement.textContent =
            "?";


        activityElement.textContent =
            "?";


        sentenceElement.textContent =
            "Roll the dice and make a complete sentence!";


        time = 30;

        timerElement.textContent =
            "30";


        score = 0;

        scoreElement.textContent =
            "0";


        timerButton.textContent =
            "⏱️ START 30s";

    }

);


</script>

</body>
</html>
